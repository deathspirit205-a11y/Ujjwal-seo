<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Exemple illustratif : volume, difficulté et valeur commerciale</title>
  <desc id="desc">Comparaison de trois requêtes fictives. Le volume diminue tandis que l’intérêt commercial illustratif augmente pour la requête locale.</desc>
  <rect width="1200" height="630" fill="#F9F6F1"/>
  <text x="72" y="74" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172A46">Exemple illustratif : trois signaux, trois lectures</text>
  <text x="72" y="111" font-family="Arial,sans-serif" font-size="16" fill="#566477">Volumes fictifs · difficulté indicative · aucun score commercial réel</text>
  <g font-family="Arial,sans-serif">
    <rect x="72" y="146" width="1056" height="112" rx="12" fill="#FFFFFF" stroke="#DEDAD2" stroke-width="2"/>
    <text x="104" y="190" font-size="19" font-weight="700" fill="#172A46">SEO</text><text x="104" y="222" font-size="15" fill="#566477">Volume fictif : 10 000</text>
    <text x="480" y="184" font-size="14" font-weight="700" fill="#566477">DIFFICULTÉ</text><text x="480" y="219" font-size="18" fill="#253248">Élevée</text>
    <text x="785" y="184" font-size="14" font-weight="700" fill="#566477">INTÉRÊT ILLUSTRATIF</text><text x="785" y="219" font-size="18" fill="#253248">Faible à moyen</text>
    <rect x="72" y="274" width="1056" height="112" rx="12" fill="#FFFFFF" stroke="#DEDAD2" stroke-width="2"/>
    <text x="104" y="318" font-size="19" font-weight="700" fill="#172A46">Recherche de mots-clés SEO</text><text x="104" y="350" font-size="15" fill="#566477">Volume fictif : 1 000</text>
    <text x="480" y="312" font-size="14" font-weight="700" fill="#566477">DIFFICULTÉ</text><text x="480" y="347" font-size="18" fill="#253248">Moyenne</text>
    <text x="785" y="312" font-size="14" font-weight="700" fill="#566477">INTÉRÊT ILLUSTRATIF</text><text x="785" y="347" font-size="18" fill="#253248">Moyen</text>
    <rect x="72" y="402" width="1056" height="112" rx="12" fill="#FFFFFF" stroke="#DEDAD2" stroke-width="2"/>
    <text x="104" y="446" font-size="19" font-weight="700" fill="#172A46">Consultant SEO pour PME à Rennes</text><text x="104" y="478" font-size="15" fill="#566477">Volume fictif : 80</text>
    <text x="480" y="440" font-size="14" font-weight="700" fill="#566477">DIFFICULTÉ</text><text x="480" y="475" font-size="18" fill="#253248">Faible à moyenne</text>
    <text x="785" y="440" font-size="14" font-weight="700" fill="#566477">INTÉRÊT ILLUSTRATIF</text><text x="785" y="475" font-size="18" fill="#087F77">Élevé</text>
  </g>
  <path d="M104 548H1096" stroke="#D9D5CD" stroke-width="2"/>
  <text x="72" y="579" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#8A3D2E">Tous les volumes et qualificatifs sont fictifs. Ils ne décrivent pas des mesures de marché.</text>
</svg>
